<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الأول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>مرحباً بيك في موقعي 🎉</h1>
            <p>ده أول موقع عملته بنفسي</p>
        </header>

        <main class="content">
            <div class="card">
                <div class="card-icon">👨‍💻</div>
                <h2>مين أنا؟</h2>
                <p id="about-text">أنا متعلم برمجة وبتعلم تطوير الويب</p>
                <button id="changeTextBtn" class="btn">غيّر النص</button>
            </div>

            <div class="card">
                <div class="card-icon">🎯</div>
                <h2>هدفك</h2>
                <p id="goal-text">أتعلم HTML, CSS, JavaScript</p>
                <button id="changeGoalBtn" class="btn">غيّر الهدف</button>
            </div>

            <div class="card">
                <div class="card-icon">⏰</div>
                <h2>الوقت الحالي</h2>
                <p id="time-text">--:--:--</p>
                <button id="showTimeBtn" class="btn">اعرض الوقت</button>
            </div>
        </main>

        <footer class="footer">
            <p>صنع بـ ❤️ باستخدام HTML, CSS, JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
